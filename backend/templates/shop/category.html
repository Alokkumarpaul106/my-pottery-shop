{% extends 'base.html' %}
{% load static %}
{% block content %}
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<!-- Tiro Bangla Font -->
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&display=swap" rel="stylesheet"> 
<!-- category section -->

<section class="font-['Tiro_Bangla'] py-4 scroll mt-10">
  <div class="max-w-7xl mx-auto px-5 ">
    <h2 class="text-3xl md:text-3xl font-bold text-center mb-8">Shop by Category</h2>

    <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 m-4">
      {% for category in categories %}

      <a href="{% url 'backend:category_products' category.slug %}" class="group">
        <div class="bg-white rounded-xl mt-2 shadow-md overflow-hidden hover:shadow-xl transition duration-300">
          <!-- Category Image -->
          <div class="w-full h-40 md:h-64 lg:h-72 overflow-hidden">
            <img src="{{ category.image.url }}"
              class="w-full h-full object-cover-fit group-hover:scale-110 transition duration-300" />
          </div>

          <!-- Category Content -->
          <div class="p-5 text-center">
            <h3 class="text-xl font-semibold text-gray-800 line-clamp-1">
              {{ category.category_name }}
            </h3>

            <p class="text-gray-500 text-sm mt-2 line-clamp-1">
              {{ category.description}}
            </p>

            
          </div>
        </div>
      </a>

      {% endfor %}
    </div>
  </div>
</section>



{% endblock %}
